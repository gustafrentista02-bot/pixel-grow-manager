# send-scheduled-messages é chamada pelo pg_cron, que não tem sessão de usuário —
# por isso verify_jwt = false. A autenticação é feita EXCLUSIVAMENTE pelo header
# x-cron-secret, cujo valor vive no Supabase Vault (pixel_crm_cron_secret) e é
# validado no banco pela RPC privada public.verify_cron_secret (service_role).
# Publishable/anon key NÃO é aceita como autenticação.
[functions.send-scheduled-messages]
verify_jwt = false

