# send-scheduled-messages é chamada por scheduler (pg_cron/externo), que não tem
# sessão de usuário — por isso verify_jwt = false. A autenticação é feita
# EXCLUSIVAMENTE pelo segredo dedicado CRON_SECRET enviado no header
# x-cron-secret; publishable/anon key NÃO é aceita como autenticação.
[functions.send-scheduled-messages]
verify_jwt = false
